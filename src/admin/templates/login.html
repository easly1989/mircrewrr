<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Torznab Proxy - Login</title>
    <script>
        // Apply a saved theme before the first paint, so the page does not flash the other one.
        try { var t = localStorage.getItem('admin-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="preload" href="/admin/static/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/admin/static/style.css">
</head>
<body>
    <main class="login-wrap">
        <form method="post" action="/admin/login" class="card">
            <div class="card-header">
                <div class="sidebar-logo">
                    <svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
                    Torznab Proxy
                </div>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label class="form-label" for="api_key">API Key</label>
                    <input id="api_key" name="api_key" type="password" class="form-input"
                           autocomplete="current-password" autofocus required>
                    <p class="form-hint">The same key used by Prowlarr/Sonarr/Radarr.</p>
                </div>
                {% if error %}
                <p role="alert" class="login-error">{{ error }}</p>
                {% endif %}
                <button type="submit" class="btn btn-primary" style="width:100%;">Log in</button>
            </div>
        </form>
    </main>
</body>
</html>

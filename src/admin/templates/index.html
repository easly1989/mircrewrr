<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Torznab Proxy - Admin</title>
    <script>
        // Apply a saved theme before the first paint, so the page does not flash the other one.
        try { var t = localStorage.getItem('admin-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="preload" href="/admin/static/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/xml/xml.min.js"></script>
    <link rel="stylesheet" href="/admin/static/style.css">
</head>
<body>
    <!-- Icons: one stroke weight, drawn once and referenced with <use> -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
        <symbol id="i-alert-triangle" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
        <symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></symbol>
        <symbol id="i-minus-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
        <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
        <symbol id="i-rows" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="1"/><rect x="3" y="14" width="18" height="7" rx="1"/></symbol>
        <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
        <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
    </svg>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg class="ico" aria-hidden="true"><use href="#i-server"/></svg>
                    <span class="sidebar-title">Torznab Proxy</span>
                </div>
                <div class="sidebar-version">v7.1.0</div>
            </div>

            <nav class="sidebar-nav">
                <button v-for="tab in tabs" :key="tab.id"
                        @click="switchTab(tab.id)"
                        :class="['nav-btn', currentTab === tab.id && 'active']">
                    <span v-html="tab.icon"></span>
                    <span class="nav-label">[[ tab.label ]]</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-status">
                    <div class="sidebar-status-line">
                        <span :class="['status-dot', status.active_sites?.length ? 'online' : 'offline']"></span>
                        [[ status.active_sites?.length || 0 ]] indexer(s) running
                    </div>
                    <div>Uptime: [[ formatUptime(status.uptime_seconds) ]]</div>
                </div>
                <div class="switch theme-switch" role="group" aria-label="Theme">
                    <button v-for="t in themes" :key="t.id" type="button" :aria-pressed="theme === t.id"
                            :title="t.label" @click="setTheme(t.id)">
                        <svg class="ico" aria-hidden="true"><use :href="'#' + t.icon"/></svg>
                        <span class="sr-only">[[ t.label ]]</span>
                    </button>
                </div>
                <form method="post" action="/admin/logout">
                    <button type="submit" class="btn btn-secondary" style="width:100%;">Log out</button>
                </form>
            </div>
        </aside>

        <!-- Main -->
        <main class="main-content">

            <!-- ============ DASHBOARD ============ -->
            <template v-if="currentTab === 'dashboard'">
                <div class="page-header">
                    <h2>Dashboard</h2>
                    <div class="switch" role="group" aria-label="Dashboard view">
                        <button type="button" :aria-pressed="dashView === 'detailed'" @click="setView('detailed')">
                            <svg class="ico" aria-hidden="true"><use href="#i-rows"/></svg>Detailed
                        </button>
                        <button type="button" :aria-pressed="dashView === 'simple'" @click="setView('simple')">
                            <svg class="ico" aria-hidden="true"><use href="#i-grid"/></svg>Simple
                        </button>
                    </div>
                </div>
                <div class="page-body">
                    <section v-if="siteList.length" :class="['verdict', 'verdict-' + verdict.tone]" role="status">
                        <div class="verdict-main">
                            <svg class="ico verdict-ico" aria-hidden="true"><use :href="'#' + verdict.icon"/></svg>
                            <div>
                                <h3>[[ verdict.title ]]</h3>
                                <p>[[ verdict.text ]]</p>
                            </div>
                        </div>
                        <a v-if="dashView === 'detailed' && verdict.target" :href="'#' + slug(verdict.target)" class="btn btn-secondary">Go to [[ verdict.target ]]</a>
                    </section>

                    <p v-if="!statusLoaded" class="form-hint" role="status">Checking...</p>
                    <div v-else-if="!siteList.length" class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
                        </svg>
                        <p>No indexer is running. Open <strong>Indexers</strong> to see why.</p>
                    </div>

                    <!-- Detailed: the path of a search through each site, and what is wrong on it -->
                    <div v-if="dashView === 'detailed'" :class="['lanes', introPlaying && 'intro']">
                        <section v-for="s in siteList" :key="s.name" :id="slug(s.name)" class="lane" :aria-label="'Path of a search through ' + s.name">
                            <div class="lane-title">
                                <h3>[[ s.name ]]</h3>
                                <span :class="['chip', 'chip-' + s.tone]">
                                    <svg class="ico" aria-hidden="true"><use :href="'#' + s.icon"/></svg>[[ s.stateText ]]
                                </span>
                            </div>
                            <div class="lane-path">
                                <template v-for="(step, i) in s.steps" :key="step.kind">
                                    <div v-if="i" :class="['link', 'link-' + step.tone]" aria-hidden="true"></div>
                                    <div :class="['node', 'node-' + (i + 1), 'node-' + step.tone]">
                                        <span class="node-kind">[[ step.kind ]]</span>
                                        <span class="node-name">[[ step.name ]]</span>
                                        <span v-if="step.text" :class="['chip', 'chip-' + step.tone]">
                                            <svg v-if="toneIcon(step.tone)" class="ico" aria-hidden="true"><use :href="'#' + toneIcon(step.tone)"/></svg>[[ step.text ]]
                                        </span>
                                    </div>
                                </template>
                            </div>
                            <div v-if="s.fix" class="fix">
                                <p>[[ s.fix.text ]]</p>
                                <button v-if="s.blocked" @click="retryLogin(s.name)" class="btn btn-primary">Retry login</button>
                            </div>
                            <div class="lane-facts">
                                <span>Thanks cache <b>[[ s.info.thanks_cached || 0 ]] topics</b></span>
                                <span>Bypass proxy <b>[[ s.info.cf_bypass_url || s.info.flaresolverr_url || '-' ]]</b></span>
                            </div>
                        </section>
                    </div>

                    <!-- Simple: one tile per site, only what needs doing -->
                    <div v-else class="tile-grid">
                        <section v-for="s in siteList" :key="s.name" :class="['site-tile', 'site-tile-' + s.tone]" :aria-label="s.name">
                            <h3>[[ s.name ]]</h3>
                            <div class="site-tile-state"><svg class="ico" aria-hidden="true"><use :href="'#' + s.icon"/></svg>[[ s.stateText ]]</div>
                            <p>[[ s.summary ]]</p>
                            <button v-if="s.blocked" @click="retryLogin(s.name)" class="btn btn-primary">Retry login</button>
                        </section>
                        <section v-for="name in externalNames" :key="'ext-' + name" :class="['site-tile', 'site-tile-' + externalTone(externals[name])]" :aria-label="'Service ' + name">
                            <h3>[[ name ]]</h3>
                            <div class="site-tile-state">
                                <svg v-if="toneIcon(externalTone(externals[name]))" class="ico" aria-hidden="true"><use :href="'#' + toneIcon(externalTone(externals[name]))"/></svg>[[ externalLabel(externals[name]) ]]
                            </div>
                            <p v-if="externals[name] && !externals[name].up">[[ externals[name].error ]]</p>
                            <button v-if="externals[name]?.up" @click="openExtSettings(name)" class="btn btn-secondary">Settings</button>
                        </section>
                    </div>

                    <template v-if="dashView === 'detailed' && externalNames.length">
                        <h3 class="section-title">External indexers</h3>
                        <div class="external-grid">
                            <section v-for="name in externalNames" :key="name" class="card" :aria-label="'External indexer ' + name">
                                <div class="card-header">
                                    <span class="site-name">[[ name ]]</span>
                                    <span :class="['badge', externalBadge(externals[name])]">[[ externalLabel(externals[name]) ]]</span>
                                </div>
                                <div class="card-body">
                                    <template v-if="externals[name]?.up">
                                        <div class="stat-row">
                                            <span class="stat-label">Version</span>
                                            <span class="stat-value">[[ externals[name].version || '-' ]]</span>
                                        </div>
                                        <div class="stat-row">
                                            <span class="stat-label">Uptime</span>
                                            <span class="stat-value">[[ formatUptime(externals[name].uptime_seconds) ]]</span>
                                        </div>
                                        <div class="stat-row">
                                            <span class="stat-label">Solver</span>
                                            <!-- No cookies is normal: the solver only runs when Cloudflare challenges a request. -->
                                            <span :class="['badge', externals[name].solver?.cookies_valid ? 'badge-success' : 'badge-muted']"
                                                  :title="externals[name].solver?.configured && !externals[name].solver.cookies_valid ? 'No Cloudflare challenge yet: the solver runs only when the site asks for one' : ''">
                                                [[ solverLabel(externals[name].solver) ]]
                                            </span>
                                        </div>
                                        <div v-if="externals[name].errors?.length" class="stat-row">
                                            <span class="stat-label">Last error</span>
                                            <span class="stat-value ext-error" :title="externals[name].errors.at(-1).message">[[ externals[name].errors.at(-1).message ]]</span>
                                        </div>

                                        <h4 class="queue-title">Download queue</h4>
                                        <ul v-if="externals[name].queue.length" class="queue-list">
                                            <li v-for="item in externals[name].queue" :key="item.hash" class="queue-item">
                                                <div class="queue-top">
                                                    <span class="queue-name" :title="item.name">[[ item.name ]]</span>
                                                    <span :class="['badge', stateBadge(item.state)]">[[ item.state ]]</span>
                                                </div>
                                                <div class="progress" role="progressbar" :aria-label="'Progress of ' + item.name"
                                                     aria-valuemin="0" aria-valuemax="100" :aria-valuenow="pct(item.progress)">
                                                    <div class="progress-bar" :style="{ width: pct(item.progress) + '%' }"></div>
                                                </div>
                                                <div class="queue-meta">
                                                    <span>[[ pct(item.progress) ]]%</span>
                                                    <span v-if="item.state === 'downloading'">[[ formatSpeed(item.dlspeed) ]]<template v-if="formatEta(item.eta)"> &middot; ETA [[ formatEta(item.eta) ]]</template></span>
                                                    <span>[[ item.category ]]</span>
                                                </div>
                                            </li>
                                        </ul>
                                        <p v-else class="form-hint">Queue is empty.</p>
                                        <div class="ext-actions">
                                            <button @click="openExtSettings(name)" class="btn btn-secondary">Settings</button>
                                        </div>
                                    </template>
                                    <p v-else-if="externals[name]" class="ext-down" role="status">Unreachable: [[ externals[name].error ]]</p>
                                    <p v-else class="form-hint">Checking...</p>
                                </div>
                            </section>
                        </div>
                    </template>
                </div>
            </template>

            <!-- ============ INDEXERS ============ -->
            <template v-if="currentTab === 'indexers'">
                <div class="page-header">
                    <h2>Indexers</h2>
                </div>
                <div class="page-body">
                    <div class="external-grid">
                        <!-- Plugins running inside this proxy -->
                        <section v-for="c in siteCards" :key="c.name" class="card" :aria-label="c.title">
                            <div class="card-header">
                                <span class="site-name">[[ c.title ]]</span>
                                <span :class="['chip', 'chip-' + c.tone]">
                                    <svg v-if="c.icon" class="ico" aria-hidden="true"><use :href="'#' + c.icon"/></svg>[[ c.stateText ]]
                                </span>
                            </div>
                            <div class="card-body">
                                <div class="stat-row">
                                    <span class="stat-label">Kind</span>
                                    <span class="stat-value">Plugin<template v-if="c.source === 'built-in'">, built in</template><template v-else-if="c.source">, from [[ c.source ]]</template><template v-if="c.version"> (v[[ c.version ]])</template></span>
                                </div>
                                <div class="stat-row">
                                    <span class="stat-label">Address</span>
                                    <span class="stat-value stat-value-url">[[ c.cfg.base_url || '-' ]]</span>
                                </div>
                                <div class="stat-row">
                                    <span class="stat-label">Status</span>
                                    <span class="stat-value">[[ c.summary ]]</span>
                                </div>
                                <div class="ext-actions">
                                    <button @click="openEditSite(c.name, c.cfg)" class="btn btn-secondary">Settings</button>
                                    <button v-if="c.blocked" @click="retryLogin(c.name)" class="btn btn-primary">Retry login</button>
                                </div>
                            </div>
                        </section>

                        <!-- External services the panel watches (animeworld) -->
                        <section v-for="name in externalNames" :key="'ext-' + name" class="card" :aria-label="'External indexer ' + name">
                            <div class="card-header">
                                <span class="site-name">[[ name ]]</span>
                                <span :class="['chip', 'chip-' + externalTone(externals[name])]">
                                    <svg v-if="toneIcon(externalTone(externals[name]))" class="ico" aria-hidden="true"><use :href="'#' + toneIcon(externalTone(externals[name]))"/></svg>[[ externalLabel(externals[name]) ]]
                                </span>
                            </div>
                            <div class="card-body">
                                <div class="stat-row">
                                    <span class="stat-label">Kind</span>
                                    <span class="stat-value">External service</span>
                                </div>
                                <template v-if="externals[name]?.up">
                                    <div class="stat-row">
                                        <span class="stat-label">Version</span>
                                        <span class="stat-value">[[ externals[name].version || '-' ]]</span>
                                    </div>
                                    <div class="stat-row">
                                        <span class="stat-label">Download queue</span>
                                        <span class="stat-value">[[ externals[name].queue.length ]] item[[ externals[name].queue.length === 1 ? '' : 's' ]]</span>
                                    </div>
                                </template>
                                <p v-else-if="externals[name]" class="ext-down" role="status">Unreachable: [[ externals[name].error ]]</p>
                                <p v-else class="form-hint">Checking...</p>
                                <div class="ext-actions">
                                    <button v-if="externals[name]?.up" @click="openExtSettings(name)" class="btn btn-secondary">Settings</button>
                                </div>
                            </div>
                        </section>
                    </div>
                    <p v-if="!siteCards.length && !externalNames.length" class="empty-state">No indexers are set up.</p>

                    <h3 class="section-title">Plugin folder</h3>
                    <div class="card">
                        <div class="card-body">
                            <p class="form-hint plugin-hint">New plugins go in <code>data/plugins/&lt;id&gt;/</code> next to the proxy's data. Restart the proxy to load them.</p>
                            <div v-for="f in status.plugin_folders" :key="f.folder" class="stat-row">
                                <span>
                                    <span class="stat-label">[[ f.folder ]]</span>
                                    <span v-if="f.error" class="plugin-error">[[ f.error ]]</span>
                                </span>
                                <span :class="['chip', f.loaded ? 'chip-ok' : 'chip-bad']">
                                    <svg class="ico" aria-hidden="true"><use :href="'#' + (f.loaded ? 'i-check-circle' : 'i-x-circle')"/></svg>[[ f.loaded ? 'Loaded' : 'Not loaded' ]]
                                </span>
                            </div>
                            <p v-if="!(status.plugin_folders || []).length" class="form-hint">No plugin folders found.</p>
                        </div>
                    </div>
                </div>

                <!-- Settings of a plugin -->
                <div v-if="siteModal.open" class="modal-overlay" @click.self="closeSiteModal">
                    <div class="modal-content modal-xl" role="dialog" aria-modal="true" :aria-label="siteModal.title + ' settings'">
                        <div class="modal-header">
                            <h3>[[ siteModal.title ]] settings</h3>
                            <button @click="closeSiteModal" class="btn btn-ghost btn-icon" aria-label="Close">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>

                        <div style="padding:1rem 1.5rem 0;">
                            <div class="tabs-list">
                                <button v-for="t in siteModalTabs" :key="t.id"
                                        @click="siteModal.tab = t.id"
                                        :class="['tab-trigger', siteModal.tab === t.id && 'active']">
                                    [[ t.label ]]
                                </button>
                            </div>
                        </div>

                        <div class="modal-body">
                            <!-- Connection Tab -->
                            <div v-show="siteModal.tab === 'connection'">
                                <!-- Dynamic config fields from manifest -->
                                <template v-if="currentManifest">
                                    <div v-for="(schema, key) in currentManifest.config_schema" :key="key"
                                         v-show="!schema.group || schema.group === 'connection'"
                                         class="form-group">
                                        <label class="form-label">[[ schema.label || key ]]</label>
                                        <input v-if="schema.type === 'password'"
                                               v-model="siteForm[key]"
                                               :type="'password'"
                                               class="form-input"
                                               :placeholder="schema.default || ''">
                                        <input v-else
                                               v-model="siteForm[key]"
                                               class="form-input"
                                               :placeholder="schema.default || ''">
                                    </div>
                                </template>
                            </div>

                            <!-- Mappings Tab -->
                            <div v-show="siteModal.tab === 'mappings'" v-if="siteModal.editing && currentManifest">
                                <template v-for="(schema, key) in currentManifest.custom_config" :key="key">
                                    <div v-if="schema.group === 'mappings'" style="margin-bottom:1.5rem;">
                                        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.75rem;">
                                            <div>
                                                <label class="form-label" style="margin-bottom:0;">[[ schema.label ]]</label>
                                                <p class="form-hint" style="margin-top:0.125rem;">[[ schema.description ]]</p>
                                            </div>
                                            <button v-if="schema.type === 'key_value_map'" @click="addKvRow(key)" class="btn btn-secondary" style="font-size:0.75rem; padding:0.25rem 0.5rem;">
                                                + Add Row
                                            </button>
                                            <button v-if="schema.type === 'integer_list'" @click="addListItem(key)" class="btn btn-secondary" style="font-size:0.75rem; padding:0.25rem 0.5rem;">
                                                + Add
                                            </button>
                                        </div>

                                        <!-- Key-Value Map -->
                                        <div v-if="schema.type === 'key_value_map'" class="kv-editor">
                                            <div class="kv-head">
                                                <span style="flex:1;">[[ schema.key_label || 'Key' ]]</span>
                                                <span style="flex:1;">[[ schema.value_label || 'Value' ]]</span>
                                                <span style="width:2rem;"></span>
                                            </div>
                                            <div v-for="(row, i) in customConfig[key]" :key="i" class="kv-row">
                                                <input v-model="row.key" class="form-input" :placeholder="schema.key_label || 'Key'">
                                                <input v-model="row.value" class="form-input" :placeholder="schema.value_label || 'Value'">
                                                <button @click="removeKvRow(key, i)" class="btn btn-ghost btn-icon">
                                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                                </button>
                                            </div>
                                        </div>

                                        <!-- Integer List -->
                                        <div v-if="schema.type === 'integer_list'" class="kv-editor">
                                            <div v-for="(item, i) in customConfig[key]" :key="i" class="kv-row">
                                                <input v-model="customConfig[key][i]" class="form-input" type="number">
                                                <button @click="customConfig[key].splice(i, 1)" class="btn btn-ghost btn-icon">
                                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <!-- Scraping Tab -->
                            <div v-show="siteModal.tab === 'scraping'" v-if="siteModal.editing && currentManifest">
                                <template v-for="(schema, key) in currentManifest.custom_config" :key="key">
                                    <div v-if="schema.group === 'scraping'" style="margin-bottom:1.5rem;">
                                        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.75rem;">
                                            <div>
                                                <label class="form-label" style="margin-bottom:0;">[[ schema.label ]]</label>
                                                <p class="form-hint" style="margin-top:0.125rem;">[[ schema.description ]]</p>
                                            </div>
                                            <button @click="addKvRow(key)" class="btn btn-secondary" style="font-size:0.75rem; padding:0.25rem 0.5rem;">
                                                + Add Row
                                            </button>
                                        </div>
                                        <div class="kv-editor">
                                            <div class="kv-head">
                                                <span style="flex:1;">[[ schema.key_label || 'Key' ]]</span>
                                                <span style="flex:1;">[[ schema.value_label || 'Value' ]]</span>
                                                <span style="width:2rem;"></span>
                                            </div>
                                            <div v-for="(row, i) in customConfig[key]" :key="i" class="kv-row">
                                                <input v-model="row.key" class="form-input" :placeholder="schema.key_label || 'Key'">
                                                <input v-model="row.value" class="form-input" :placeholder="schema.value_label || 'Value'">
                                                <button @click="removeKvRow(key, i)" class="btn btn-ghost btn-icon">
                                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <!-- Advanced Tab (capabilities XML, code) -->
                            <div v-show="siteModal.tab === 'advanced'" v-if="siteModal.editing && currentManifest">
                                <template v-for="(schema, key) in currentManifest.custom_config" :key="key">
                                    <div v-if="schema.group === 'advanced'" style="margin-bottom:1.5rem;">
                                        <label class="form-label">[[ schema.label ]]</label>
                                        <p class="form-hint" style="margin-bottom:0.5rem;">[[ schema.description ]]</p>
                                        <div :ref="el => codeRefs[key] = el" style="min-height:200px;"></div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button @click="closeSiteModal" class="btn btn-secondary">Cancel</button>
                            <button @click="saveSite" class="btn btn-primary">Save</button>
                        </div>
                    </div>
                </div>
            </template>

            <!-- External indexer settings (animeworldtv-indexer /api/settings) -->
            <div v-if="extSettings.open" class="modal-overlay" @click.self="extSettings.open = false">
                <div class="modal-content modal-md" role="dialog" aria-modal="true" :aria-label="extSettings.name + ' settings'">
                    <div class="modal-header">
                        <h3>[[ extSettings.name ]] settings</h3>
                        <button @click="extSettings.open = false" class="btn btn-ghost btn-icon" aria-label="Close">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div v-if="extSettings.restartRequired" class="ext-restart" role="status">
                            <span>Saved. Restart the indexer to apply the changes.</span>
                            <button @click="restartExt" :disabled="extSettings.busy" class="btn btn-primary">Restart now</button>
                        </div>
                        <div v-for="s in extSettings.items" :key="s.key" class="form-group">
                            <label class="form-label" :for="'ext-' + s.key">[[ s.label ]]</label>
                            <input :id="'ext-' + s.key" v-model="extSettings.form[s.key]" class="form-input" :placeholder="s.saved ? '' : s.value">
                            <p class="form-hint">
                                [[ s.help ]]
                                <template v-if="s.running !== s.value"> &middot; in use now: [[ s.running ]]</template>
                                <template v-if="s.saved"> &middot; set here; empty the field to go back to the .env value</template>
                            </p>
                        </div>
                        <p v-if="extSettings.error" class="ext-down" role="alert">[[ extSettings.error ]]</p>
                    </div>
                    <div class="modal-footer">
                        <button @click="extSettings.open = false" class="btn btn-secondary">Close</button>
                        <button @click="saveExtSettings" :disabled="extSettings.busy" class="btn btn-primary">Save</button>
                    </div>
                </div>
            </div>

            <!-- ============ CONFIGURATION ============ -->
            <template v-if="currentTab === 'config'">
                <div class="page-header">
                    <h2>Configuration</h2>
                </div>
                <div class="page-body">
                    <div class="card" style="max-width:40rem;">
                        <div class="card-body">
                            <div class="form-group">
                                <label class="form-label" for="cfg-api-key">API Key</label>
                                <input id="cfg-api-key" v-model="configForm.api_key" class="form-input" placeholder="Your Torznab API key">
                                <p class="form-hint">Used by Sonarr/Radarr/Prowlarr to authenticate requests</p>
                            </div>
                            <div class="separator"></div>
                            <form class="form-group" @submit.prevent="saveAccount" autocomplete="off">
                                <span class="form-label">Panel account</span>
                                <p class="form-hint" style="margin-bottom:0.75rem;">
                                    <template v-if="account.current">Logs in to this panel as <strong>[[ account.current ]]</strong>. The API key still works as a fallback.</template>
                                    <template v-else>No account yet: the panel asks for the API key. Set a username and password to log in with them instead.</template>
                                </p>
                                <div class="account-row">
                                    <input v-model="account.username" class="form-input" aria-label="Username" placeholder="Username" autocomplete="username">
                                    <input v-model="account.password" type="password" class="form-input" aria-label="Password" placeholder="Password (10+ characters)" autocomplete="new-password">
                                    <button type="submit" class="btn btn-secondary" :disabled="account.busy">[[ account.current ? 'Change' : 'Set account' ]]</button>
                                </div>
                                <p v-if="account.error" role="alert" class="login-error" style="margin:0.5rem 0 0;">[[ account.error ]]</p>
                            </form>
                            <div class="separator"></div>
                            <div class="form-group">
                                <label class="form-label" for="cfg-cf-url">Cloudflare Bypass Proxy URL</label>
                                <input id="cfg-cf-url" v-model="configForm.cf_bypass_url" class="form-input" placeholder="http://localhost:8191">
                                <p class="form-hint">URL of your Byparr, FlareSolverr, or compatible CF bypass service</p>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="cfg-cf-timeout">Cloudflare Bypass Timeout (ms)</label>
                                <input id="cfg-cf-timeout" v-model.number="configForm.cf_bypass_timeout" type="number" class="form-input">
                                <p class="form-hint">Maximum time to wait for CF challenge resolution</p>
                            </div>
                            <div class="separator"></div>
                            <div class="form-group">
                                <div style="display:flex; align-items:center; justify-content:space-between; gap:0.75rem;">
                                    <label class="form-label" style="margin-bottom:0;">External Indexers</label>
                                    <button @click="addIndexer" class="btn btn-secondary" style="font-size:0.75rem; padding:0.25rem 0.5rem;">+ Add Indexer</button>
                                </div>
                                <p class="form-hint" style="margin-bottom:0.75rem;">Indexers the panel watches server-side (status, queue, logs). Use the address reachable from this container, e.g. http://animeworld-indexer:9698</p>
                                <div v-for="(ind, i) in configForm.external_indexers" :key="i" class="ext-row">
                                    <input v-model="ind.name" class="form-input" aria-label="Indexer name" placeholder="name" autocomplete="off">
                                    <input v-model="ind.url" class="form-input" aria-label="Indexer URL" placeholder="http://host:port" autocomplete="off">
                                    <input v-model="ind.api_key" @focus="clearMask(ind)" type="password" class="form-input" aria-label="Indexer API key" placeholder="API key" autocomplete="new-password">
                                    <button @click="configForm.external_indexers.splice(i, 1)" class="btn btn-ghost btn-icon" title="Remove indexer" aria-label="Remove indexer">
                                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                    </button>
                                </div>
                                <p v-if="!configForm.external_indexers.length" class="form-hint">None configured.</p>
                            </div>
                            <div class="separator"></div>
                            <div class="form-group">
                                <label class="form-label" for="cfg-log-level">Log Level</label>
                                <select id="cfg-log-level" v-model="configForm.log_level" class="form-select">
                                    <option>DEBUG</option>
                                    <option>INFO</option>
                                    <option>WARNING</option>
                                    <option>ERROR</option>
                                </select>
                            </div>
                            <div style="margin-top:1.5rem; display:flex; align-items:center; gap:0.75rem;">
                                <button @click="saveConfig" class="btn btn-primary">Save Configuration</button>
                                <span v-if="configSaved" class="text-ok" role="status" style="font-size:0.875rem; font-weight:600;">Saved</span>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- ============ LOGS ============ -->
            <template v-if="currentTab === 'logs'">
                <div class="page-header">
                    <h2>Logs</h2>
                    <div class="page-actions">
                        <select v-if="externalNames.length" v-model="logSource" class="form-select" style="width:auto;" aria-label="Log source">
                            <option value="">mircrew (this proxy)</option>
                            <option v-for="name in externalNames" :key="name" :value="name">[[ name ]]</option>
                        </select>
                        <select v-model="logFilter" class="form-select" style="width:auto;" aria-label="Log level">
                            <option value="">All Levels</option>
                            <option>DEBUG</option>
                            <option>INFO</option>
                            <option>WARNING</option>
                            <option>ERROR</option>
                        </select>
                        <button @click="logPaused = !logPaused"
                                :class="['btn', logPaused ? 'btn-primary' : 'btn-secondary']">
                            [[ logPaused ? 'Resume' : 'Pause' ]]
                        </button>
                        <button @click="logs = []" class="btn btn-secondary">Clear</button>
                    </div>
                </div>
                <div class="page-body" style="display:flex; flex-direction:column; height:calc(100vh - 5rem);">
                    <p v-if="logSource && externals[logSource] && !externals[logSource].up" class="ext-down" role="status" style="margin-bottom:0.75rem;">
                        [[ logSource ]] is unreachable: [[ externals[logSource].error ]]. Retrying...
                    </p>
                    <div ref="logContainer" class="log-container" style="flex:1;">
                        <div v-for="(log, i) in filteredLogs" :key="i" class="log-entry">
                            <span class="log-time">[[ log.timestamp ]]</span>
                            <span :class="['log-level', log.level?.toLowerCase()]">[[ log.level ]]</span>
                            <span class="log-msg">[[ log.message ]]</span>
                        </div>
                        <div v-if="!filteredLogs.length" class="empty-state" style="padding:3rem;">
                            No logs to display
                        </div>
                    </div>
                </div>
            </template>
        </main>

        <!-- Toast -->
        <div class="toast-container">
            <div v-for="(t, i) in toasts" :key="i" :class="['toast', 'toast-' + t.type]">
                [[ t.message ]]
            </div>
        </div>
    </div>

    <script src="/admin/static/app.js"></script>
</body>
</html>
